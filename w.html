<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f8a5b">
<title>وەستاکان</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;background:#f4f7f5;color:#1c2a24;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top{width:100%;background:linear-gradient(140deg,#1f8a5b,#16a06a);color:#fff;text-align:center;padding:26px 16px 30px;border-radius:0 0 28px 28px}
.top h1{font-size:22px;font-weight:800}.top p{opacity:.9;font-size:13.5px;margin-top:4px}
.wrap{width:100%;max-width:460px;padding:16px}
.card{background:#fff;border:1px solid #dfe8e3;border-radius:20px;padding:20px;text-align:center;box-shadow:0 4px 14px rgba(20,60,40,.06)}
.av{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#e7f5ee;margin:-52px auto 10px;display:flex;align-items:center;justify-content:center;font-size:40px;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.av.sq{border-radius:18px}
h2{font-size:21px;font-weight:900;margin-bottom:4px}
.pf{color:#1f8a5b;font-weight:700;font-size:14.5px;line-height:1.7}
.ct{color:#6b7a72;font-size:13.5px;margin-top:2px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:16px;text-align:center;text-decoration:none;margin-top:12px;border:0;cursor:pointer}
.b-app{background:linear-gradient(140deg,#1f8a5b,#16a06a);color:#fff;box-shadow:0 6px 16px rgba(31,138,91,.28)}
.b-call{background:#fff;color:#1c2a24;border:1.5px solid #dfe8e3}
.b-wa{background:#25d366;color:#fff}
.b-dl{background:#fff;color:#1f8a5b;border:1.5px solid #1f8a5b}
.note{color:#6b7a72;font-size:12.5px;text-align:center;margin-top:14px;line-height:1.8}
.tag{color:#1f8a5b;font-weight:800;font-size:13.5px;text-align:center;margin-top:18px}
.spin{width:26px;height:26px;border:3px solid #e7f5ee;border-top-color:#1f8a5b;border-radius:50%;animation:s 1s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top"><h1>وەستاکان</h1><p>یەکەمین بەرنامەی کوردی وەستا لە کوردستان</p></div>
<div class="wrap">
  <div class="card" id="card"><div class="spin"></div></div>
  <a class="btn b-app" id="openApp" style="display:none">📲 کردنەوە لە ئەپی وەستاکان</a>
  <a class="btn b-dl" id="dl" style="display:none" target="_blank" rel="noopener">⬇️ دابەزاندنی ئەپەکە</a>
  <div class="note" id="note"></div>
  <div class="tag">یەکەمین بەرنامەی کوردی وەستا لە کوردستان</div>
</div>
<script>
/* ===== settings ===== */
const PACKAGE='com.workers.krd';                    // the Android package of the CUSTOMER app (workers + trucks live in the same app)
const DOWNLOAD_URL='';                              // the download link of the app (put it here; the button is hidden while empty)
const WORKERS_URL='https://raw.githubusercontent.com/Nextgenerationpro/bina-cost-data/main/workers.json';
const ADS_URL='https://raw.githubusercontent.com/Nextgenerationpro/bina-cost-data/main/ads.json';   // trucks live inside ads.json

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=new URLSearchParams(location.search);
const workerId=(qs.get('id')||'').replace(/[^A-Za-z0-9_-]/g,'');
const truckId=(qs.get('truck')||'').replace(/[^A-Za-z0-9_-]/g,'');
const isTruck = !!truckId && !workerId;
const id = isTruck ? truckId : workerId;
const isAndroid=/android/i.test(navigator.userAgent);

if(DOWNLOAD_URL){ const d=$('#dl'); d.href=DOWNLOAD_URL; d.style.display='block'; }

/* open the worker/truck inside the app (Android) — falls back to the download page when the app is not installed */
function appLink(){
  const fb = DOWNLOAD_URL ? ';S.browser_fallback_url='+encodeURIComponent(DOWNLOAD_URL) : '';
  const path = isTruck ? 'truck/'+id : 'w/'+id;                 // MainActivity tells these two apart by the host segment
  return 'intent://'+path+'#Intent;scheme=wasta;package='+PACKAGE+fb+';end';
}
if(isAndroid && id){
  const b=$('#openApp'); b.href=appLink(); b.style.display='block';
  setTimeout(()=>{ try{ location.href=appLink(); }catch(e){} },400);      // most phones open the app by themselves
} else if(!isAndroid){
  $('#note').textContent='ئەپی وەستاکان بۆ ئەندرۆیدە. لێرەوە دەتوانیت پەیوەندی بکەیت.';
}

/* show the worker or truck, so the link is useful even without the app */
(async function(){
  const card=$('#card');
  if(!id){ card.innerHTML='<div class="pf">لینکەکە تەواو نییە.</div>'; return; }

  if(isTruck){
    try{
      const r=await fetch(ADS_URL,{cache:'no-cache'}); const ads=await r.json();
      const t=((ads&&ads.trucks)||[]).find(x=>x.id===id);
      if(!t){ card.innerHTML='<div class="pf">ئەم سەیارەیە نەدۆزرایەوە.</div>'; return; }
      const loc=[t.city,...(t.neighborhoods||[])].filter(Boolean).join('، ');
      card.innerHTML=(t.image?'<img class="av sq" src="'+esc(t.image)+'" alt="">':'<div class="av sq">🚛</div>')+
        '<h2>'+esc(t.name)+'</h2>'+(loc?'<div class="ct">📍 '+esc(loc)+'</div>':'')+
        (t.phone?'<a class="btn b-call" href="tel:'+esc(t.phone)+'">📞 پەیوەندی</a>':'');
      document.title=t.name+' — سەیارەی بار — وەستاکان';
    }catch(e){ card.innerHTML='<div class="pf">نەتوانرا زانیاری سەیارە بخوێنرێتەوە.</div>'; }
    return;
  }

  try{
    const r=await fetch(WORKERS_URL,{cache:'no-cache'}); const list=await r.json();
    const w=(list||[]).find(x=>x.id===id);
    if(!w){ card.innerHTML='<div class="pf">ئەم وەستایە نەدۆزرایەوە.</div>'; return; }
    const pf=(w.professions||[w.profession]).filter(Boolean).join('، '), ct=(w.cities||[w.city]).filter(Boolean).join('، ');
    const av=w.avatar||(w.photos&&w.photos[0]);
    const wa=String(w.phone||'').replace(/[^0-9]/g,'');
    card.innerHTML=(av?'<img class="av" src="'+esc(av)+'" alt="">':'<div class="av">👷</div>')+
      '<h2>'+esc(w.name)+'</h2>'+(pf?'<div class="pf">'+esc(pf)+'</div>':'')+(ct?'<div class="ct">📍 '+esc(ct)+'</div>':'')+
      (w.phone?'<a class="btn b-call" href="tel:'+esc(w.phone)+'">📞 پەیوەندی</a><a class="btn b-wa" href="https://wa.me/'+wa+'" target="_blank" rel="noopener">💬 واتسئەپ</a>':'');
    document.title=w.name+' — وەستاکان';
  }catch(e){ card.innerHTML='<div class="pf">نەتوانرا زانیاری وەستا بخوێنرێتەوە.</div>'; }
})();
</script>
</body>
</html>
